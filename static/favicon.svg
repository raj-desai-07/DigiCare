<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dcBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#91121d"/>
      <stop offset="100%" stop-color="#640910"/>
    </linearGradient>
    <filter id="dcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#46050b" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#dcBrandGrad)"/>
  
  <!-- Subtle Inner Accent Border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" fill="none" stroke="#f3cfd2" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Heart and Cardiac Pulse Wave -->
  <g filter="url(#dcGlow)">
    <!-- Heart Silhouette -->
    <path d="M32 47.5 C32 47.5 15 37 15 25.5 C15 19.5 19.5 15.5 25 15.5 C28.5 15.5 31 17.5 32 19 C33 17.5 35.5 15.5 39 15.5 C44.5 15.5 49 19.5 49 25.5 C49 37 32 47.5 32 47.5 Z" 
          fill="#790D16" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          stroke-linejoin="round"/>
    
    <!-- Heartbeat ECG Rhythm Line -->
    <path d="M19 28.5 L24 28.5 L26.5 22.5 L30 35.5 L33.5 24.5 L36.5 31.5 L39 28.5 L45 28.5" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.6" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
